<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <title>DGA Verify Bar - Web Component</title>
</head>

<body class="dga-bg-gray-25">

&lt;/dga-verify-bar&gt;</code></pre>
      </div>
